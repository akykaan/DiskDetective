appId: com.folderanalyzer.app
productName: Klasör Boyutu Analiz
copyright: Copyright 2024

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false

extraMetadata:
  main: dist-electron/main.js
